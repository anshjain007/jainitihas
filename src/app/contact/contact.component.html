<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #c3cfe2, #c3cfe2, #e2ebf0);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .contact-card {
      background: #ffffff;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 600px;
      width: 90%;
      animation: slideUp 0.8s ease-in-out;
    }

    @keyframes slideUp {
      0% {
        opacity: 0;
        transform: translateY(40px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .contact-card h2 {
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 32px;
    }

    .contact-card p {
      font-size: 18px;
      color: #34495e;
      margin: 15px 0;
    }

    .contact-card a {
      color: #1a73e8;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .contact-card a:hover {
      color: #0d47a1;
      text-decoration: underline;
    }

    .social-links {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .social-links a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 30px;
      background: #f5f5f5;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .social-links a:hover {
      transform: translateY(-5px);
      background: #e0e0e0;
    }

    .social-links i {
      font-size: 20px;
    }

    @media (max-width: 600px) {
      .contact-card {
        padding: 30px 20px;
      }

      .social-links {
        flex-direction: column;
        align-items: center;
      }

      .social-links a {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="contact-card">
    <h2>Contact Us</h2>

    <p>
      <b><i class="fas fa-envelope" style="color: #dd4b39;"></i> Email:</b>
      <a href="mailto:jainitihaas@gmail.com">jainitihaas&#64;gmail.com</a>
    </p>

    <h3 style="margin-top: 30px; color: #2c3e50;">Follow Us</h3>

    <div class="social-links">
      <a href="https://www.facebook.com/share/1AUVZJrsYa/" target="_blank" style="color: #3b5998;">
        <i class="fab fa-facebook-square"></i> Facebook
      </a>

      <a href="https://www.instagram.com/jain_itihas/" target="_blank" style="color: #E1306C;">
        <i class="fab fa-instagram"></i> Instagram
      </a>

      <a href="https://x.com/Jain_Itihaas?t=aE3NPL97P1-Ryps7FP_SCw&s=09" target="_blank" style="color: #1DA1F2;">
        <i class="fab fa-x-twitter"></i> Twitter
      </a>

      <a href="https://www.youtube.com/@jainitihas" target="_blank" style="color: #FF0000;">
        <i class="fab fa-youtube"></i> YouTube
      </a>
    </div>
  </div>

</body>
</html>
